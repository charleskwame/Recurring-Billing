<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Checkout Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #172033;
        background: #eef3f7;
      }

      body {
        background:
          radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.9), transparent 34%),
          linear-gradient(135deg, #eaf1f5 0%, #f8f5ef 52%, #dfe9e8 100%);
        margin: 0;
        padding: 32px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      #unified-checkout-container {
        width: 100%;
        max-width: 430px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 22px 55px rgba(35, 54, 67, 0.16);
        box-sizing: border-box;
        backdrop-filter: blur(12px);
      }

      .checkout-eyebrow {
        margin: 0 0 8px;
        color: #147d78;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #unified-checkout-container p {
        margin: 0;
        color: #53606d;
      }

      #orderSummaryTitle {
        margin-bottom: 22px;
        color: #172033;
        font-family: Georgia, serif;
        font-size: 30px;
        line-height: 1.1;
      }

      #proceedToPayment {
        width: 100%;
        padding: 15px 18px;
        margin-top: 24px;
        background-color: #147d78;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 160ms ease, transform 160ms ease, opacity 160ms ease;
      }

      #proceedToPayment:hover:not(:disabled) {
        background-color: #0e615e;
        transform: translateY(-1px);
      }

      #proceedToPayment:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #buttonPaymentListContainer,
      #embeddedPaymentContainer {
        width: 100%;
      }

      #checkoutSidebar {
        position: fixed;
        z-index: 10;
        top: 0;
        right: 0;
        display: grid;
        align-content: start;
        gap: 18px;
        width: min(440px, 100vw);
        height: 100vh;
        padding: 32px 24px;
        box-sizing: border-box;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.98);
        box-shadow: -18px 0 45px rgba(35, 54, 67, 0.18);
        transform: translateX(100%);
        transition: transform 220ms ease;
      }

      #unified-checkout-container.is-initializing + #checkoutSidebar {
        transform: translateX(0);
      }

      #orderSummary {
        display: grid;
        gap: 18px;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      #unified-checkout-container.is-initializing #orderSummary {
        display: none;
      }

      #priceDiv {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 18px;
        border-top: 1px solid #e2e8eb;
      }

      #itemName {
        color: #172033;
        font-size: 18px;
        font-weight: 700;
      }

      #priceDiv p:last-child {
        color: #172033;
        font-size: 24px;
        font-weight: 800;
      }

      @media (max-width: 520px) {
        body {
          padding: 18px 14px;
        }

        #unified-checkout-container {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div id="unified-checkout-container">
      <p class="checkout-eyebrow">Unified Checkout Demo</p>
      <div id="orderSummary">
        <p id="orderSummaryTitle">Order Summary</p>
        <p id="itemName">1x BMX Racing Bike</p>
        <div id="priceDiv">
          <p>GHC</p>
          <p>300.00</p>
        </div>
      </div>
      <button id="proceedToPayment">Proceed to Payment</button>
    </div>

    <aside id="checkoutSidebar" aria-label="Payment checkout">
      <h2>Complete Payment</h2>
      <!-- Container for payment option buttons (Google Pay, Apple Pay, Card, etc.) -->
      <div id="buttonPaymentListContainer"></div>

      <!-- Container for embedded payment forms -->
      <div id="embeddedPaymentContainer"></div>
    </aside>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script src="./index.js" type="module"></script>
</html>
